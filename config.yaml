# Radar de Passagens — configuração pessoal
# Edite à vontade. Datas no formato AAAA-MM-DD. Valores em reais (R$).

origem: BEL            # Belém (Castanhal fica a ~70 km)

# Seus saldos de pontos (atualize de vez em quando).
saldos:
  azul: 0              # Azul Fidelidade
  livelo: 0            # Livelo
  cartao: 0            # pontos do cartão (ex.: Inter Loop)

# Como cada programa vira ponto Azul (1 ponto = 1 ponto Azul na proporção 1.0).
# "bonus" é o bônus que você tem garantido agora (em %). O radar também detecta
# promoções de bônus nos blogs e mostra quanto você ganharia com elas.
programas:
  livelo:
    nome: Livelo
    proporcao: 1.0
    bonus: 0
    palavras: [livelo]
  cartao:
    nome: Inter Loop
    proporcao: 1.0
    bonus: 0
    palavras: [inter, loop]

# Os pontos Azul são estimados a partir do preço da própria Azul em R$. Para a
# estimativa ficar boa, anote de vez em quando no arquivo pontos_azul.yaml alguns
# preços em pontos que você viu no site da Azul: o radar aprende a proporção.
#
# Quanto vale 1.000 pontos Azul em R$ (usado só para ESTIMAR pontos quando não
# há dados reais de resgate). Também é a régua do "vale a pena usar pontos?".
valor_milheiro_azul: 16.0

# Quem viaja. O primeiro grupo é o principal: é o usado em "Oportunidades" e nos
# alertas. Os preços são buscados já para o grupo inteiro (e mostrados também por
# pessoa). Crianças de 2 a 11 anos pagam assento.
viajantes:
  familia:
    nome: Família
    adultos: 2
    criancas: 3        # 3, 5 e 9 anos
  casal:
    nome: Casal
    adultos: 2
    criancas: 0

# Destinos que você acompanha sempre (ida e volta a partir da origem).
rotas:
  - destino: MCZ
    nome: Maceió
    alvo_reais: 900          # me avise se ida+volta POR PESSOA ficar abaixo disso
    alvo_pontos: 25000       # ...ou abaixo disso em pontos Azul por pessoa
  - destino: REC
    nome: Recife
    alvo_reais: 700
    alvo_pontos: 20000

# Janelas de viagem: o radar procura as melhores combinações de ida/volta
# dentro delas, respeitando o tempo de estadia.
janelas:
  - nome: Fim de ano
    inicio: 2026-12-12
    fim: 2027-01-15
    estadia_min: 7
    estadia_max: 21
  - nome: Próximos meses (flexível)
    meses_a_frente: 6
    estadia_min: 5
    estadia_max: 21

# "Para onde dá pra ir barato?" — ofertas saindo da origem para qualquer lugar.
# O radar junta duas fontes: os destinos que aparecem no cache da Travelpayouts e
# a lista de "candidatos" abaixo, conferida dia a dia no Google Voos em rodízio
# (max_destinos por rodada; com 3 rodadas por dia a lista inteira é vista em ~1 dia).
qualquer_destino:
  meses_a_frente: 3
  preco_max_alerta: 1200     # avisa quando ida+volta POR PESSOA ficar abaixo disso
  estadia_min: 3             # noites
  estadia_max: 10
  max_destinos: 15
  candidatos: [
    # Norte e Nordeste
    FOR, SLZ, SSA, NAT, JPA, AJU, THE, MAO, MCP, STM, MAB, PMW, IOS, BPS, FEN, JJD,
    # Centro-Oeste, Sudeste e Sul
    BSB, GYN, CGB, GRU, CGH, VCP, GIG, SDU, CNF, VIX, CWB, FLN, NVT, POA, IGU,
    # América do Sul, Caribe e Guianas
    LIM, CUZ, BOG, MDE, CTG, PTY, EZE, SCL, MVD, CAY, PBM, CUN, PUJ,
    # EUA e Europa
    MIA, FLL, MCO, JFK, LIS, OPO, MAD]
  excluir: []                # códigos IATA que você não quer ver

# Promoções: feeds RSS de blogs de milhas e passagens.
promocoes:
  feeds:
    - https://passageirodeprimeira.com/feed/
    - https://www.melhoresdestinos.com.br/feed
    - https://pontospravoar.com/feed/
  dias_recentes: 10          # ignora posts mais antigos que isso

alertas:
  queda_minima_pct: 10       # avisa quando o menor preço cair X% vs histórico
