[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-passagens"
version = "0.1.0"
description = "Radar pessoal de passagens baratas (dinheiro e pontos) e promoções de milhas"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
