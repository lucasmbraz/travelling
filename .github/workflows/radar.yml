name: Radar de passagens

on:
  schedule:
    - cron: "17 9,15,21 * * *"   # 3x por dia (06h17, 12h17 e 18h17 em Belém)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.yaml", "radar/**", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

env:
  # O painel fica no branch "painel" e é aberto pelo raw.githack.com, que entrega o
  # arquivo do GitHub como página (o endereço "raw" do GitHub mostraria só o código).
  PAINEL_URL: https://raw.githack.com/${{ github.repository }}/painel/index.html

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: Atualizar dados, gerar painel e enviar alertas
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SEATS_AERO_KEY: ${{ secrets.SEATS_AERO_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SALDOS: ${{ secrets.SALDOS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || env.PAINEL_URL }}
        run: python -m radar painel

      - name: Guardar histórico de preços
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico de preços"
            git pull --rebase -q origin main
            git push origin HEAD:main
          fi

      - name: Publicar painel no branch "painel"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Um único commit, sempre substituído: o branch não cresce com o tempo.
          cd site
          git init -q -b painel
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add index.html
          git commit -q -m "Painel atualizado em $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" painel
          echo "### 📊 Painel: ${PAINEL_URL}" >> "$GITHUB_STEP_SUMMARY"
